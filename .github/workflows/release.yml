name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  publish:
    name: Publish to crates.io
    runs-on: macos-latest
    timeout-minutes: 15
    # crates.io accepts trusted publishing only from this workflow and environment.
    environment: release
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install just, cargo-deny, and cargo-semver-checks
        uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-deny,cargo-semver-checks

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check that the tag agrees with the version
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "The tag $GITHUB_REF_NAME does not agree with the version $version in Cargo.toml."
            exit 1
          fi

      - name: Check the dependencies
        run: just deny

      - name: Check the semantic versioning
        run: just semver

      # The action exchanges the OIDC token of the job for a crates.io token that expires after 30 minutes.
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
