name: CI

on:
  push:
    branches: [main, next]
  pull_request:
  workflow_dispatch:

# Each job states the permissions that it needs.
permissions: {}

# A new push to a pull request cancels the run of the previous push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  crate:
    name: Build, test, lint, format
    runs-on: macos-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install just and taplo
        uses: taiki-e/install-action@v2
        with:
          tool: just,taplo

      - name: Install Rust nightly for rustfmt and rustdoc
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Show Rust version
        run: rustc --version

      # Pull requests restore the cache of the branch that they merge into and save no cache of their own.
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Build
        run: just build

      - name: Run tests
        run: just test

      - name: Lint
        run: just clippy

      - name: Build docs
        run: just doc

      # Build and test errors fail before formatting errors.
      - name: Run rustfmt
        run: just fmt-check

      - name: Check the TOML formatting
        run: just taplo-check
