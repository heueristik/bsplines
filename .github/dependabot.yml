version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    # Development happens on next, not on the default branch main.
    target-branch: next
    schedule:
      interval: weekly
    # New versions wait 3 days, as `global-min-publish-age` in .cargo/config.toml requires. Security updates do not wait.
    cooldown:
      default-days: 3

  - package-ecosystem: github-actions
    directory: /
    target-branch: next
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
