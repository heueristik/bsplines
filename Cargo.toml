[package]
name = "bsplines"
license = "Apache-2.0"
version = "0.0.1-alpha.9"
authors = ["Michael A. Heuer <decentralised.systems@gmail.com>"]
edition = "2024"
rust-version = "1.89"
description = "N-dimensional B-spline curves and their derivatives built on top of nalgebra"
keywords = ["b-spline", "spline", "curve", "derivatives", "nalgebra"]
categories = ["mathematics", "algorithms", "graphics"]

readme = "README.md"
homepage = "https://github.com/heueristik/bsplines"
repository = "https://github.com/heueristik/bsplines"
documentation = "https://docs.rs/bsplines"

[package.metadata.docs.rs]
features = ["doc-images"]

[features]
doc-images = []

[lib]
name = "bsplines"
path = "src/lib.rs"

[[example]]
name = "doc-images"
path = "doc-images/src/main.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
enum_glob_use = "deny"
type_complexity = "allow"

[dependencies]
embed-doc-image = "0.1.4"
nalgebra = "0.35.0"
thiserror = "2.0.19"

[dev-dependencies]
rstest = "0.26.1"
approx = "0.5.1"
plotters = "0.3.7"
plotters-arrows = "0.1.0"
num-traits = "0.2.19"
